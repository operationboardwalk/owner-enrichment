<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Boardwalk Agent</title>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2d3148;
      --accent: #4f6ef7; --text: #e2e8f0; --muted: #94a3b8;
      --crit: #ef4444; --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
    }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 36px 32px;
      width: 100%; max-width: 360px;
    }
    h1 { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
    h1 span { color: var(--accent); }
    p.sub { font-size: 0.82rem; color: var(--muted); margin-bottom: 24px; }
    label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 5px; }
    input[type=password] {
      width: 100%; background: #0f1117; border: 1px solid var(--border);
      color: var(--text); padding: 9px 12px; border-radius: 6px;
      font-size: 0.9rem; outline: none; transition: border-color .15s;
      margin-bottom: 16px;
    }
    input[type=password]:focus { border-color: var(--accent); }
    button {
      width: 100%; background: var(--accent); color: #fff; border: none;
      padding: 10px; border-radius: 6px; font-size: 0.9rem;
      font-weight: 600; cursor: pointer; transition: opacity .15s;
    }
    button:hover { opacity: .85; }
    .error {
      background: #450a0a; border: 1px solid var(--crit); color: #fca5a5;
      border-radius: 6px; padding: 9px 12px; font-size: 0.82rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>🛠 Boardwalk <span>Agent</span></h1>
  <p class="sub">Enter your password to continue.</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autofocus autocomplete="current-password" />
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
